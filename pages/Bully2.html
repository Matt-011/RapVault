<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            background: white;
            overflow: hidden;
            font-family: sans-serif;
        }

        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #6a00ff;
            z-index: 999;
            opacity: 1;
            transition: opacity 1.5s ease;
        }

        #cd {
            position: absolute;
            top: 50%;
            left: 20%;
            cursor: grab;
            user-select: none;
            z-index: 10;
            transition: all 0.25s ease;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.35)) drop-shadow(0 0 25px rgba(255, 200, 0, 0.25));
            animation: float 2.5s ease-in-out infinite;

            /* SCALE PROPORTIONALLY */
            max-width: 200px;
            max-height: 200px;
            width: auto;
            height: auto;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        #player {
            position: absolute;
            top: 50%;
            left: 70%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.1s ease;
            object-fit: contain;

            /* SCALE PROPORTIONALLY */
            max-width: 700px;
            max-height: 700px;
            width: auto;
            height: auto;
        }

        #player:active {
            transform: translate(-50%, -50%) scale(0.97);
        }
    </style>
</head>

<body>

    <div id="intro" style="opacity: 0; display: none;"></div>
    <img id="cd" src="../images/artworks-wzQUMjqDCATEpycc-ODZgQg-t500x500.jpg" draggable="false">
    <img id="cd" src="" draggable="false">
    <img id="player" src="../images/closed.png">
    <audio id="audio" src="../musicas/Joias da Família (feat. MAIK sbkaos, Biffe & Hakuro) - Yung Lixo (youtube).mp3"></audio>
    <audio id="heldSound" src="../musicas/held.mp3"></audio>
    <audio id="switchSound" src="../musicas/switch.mp3"></audio>
    <script>

        const cd = document.getElementById("cd");
        const player = document.getElementById("player");
        const audio = document.getElementById("audio");
        const heldSound = document.getElementById("heldSound");
        const switchSound = document.getElementById("switchSound");
        const intro = document.getElementById("intro");

        let holding = false;
        let playerState = "closed";
        let hasCD = false;

        cd.addEventListener("dragstart", (e) => e.preventDefault());

        function toggleHold() {
            holding = !holding;

            if (holding) {
                cd.style.cursor = "grabbing";
                cd.style.animation = "none";
                cd.style.filter = "none";

                heldSound.currentTime = 0;
                heldSound.volume = 0.4;
                heldSound.play().catch(() => { });

            } else {
                cd.style.cursor = "grab";

                if (playerState === "open" && !hasCD) {
                    const p = player.getBoundingClientRect();
                    const c = cd.getBoundingClientRect();

                    const overlap =
                        c.right > p.left &&
                        c.left < p.right &&
                        c.bottom > p.top &&
                        c.top < p.bottom;

                    if (overlap) {
                        const centerX = p.left + p.width / 2;
                        const centerY = p.top + p.height / 2;
                        cd.style.left = (centerX - cd.offsetWidth / 2) + "px";
                        cd.style.top = (centerY - cd.offsetHeight / 2) + "px";

                        setTimeout(() => {
                            cd.style.display = "none";
                            player.src = "../images/loaded.png";
                            playerState = "open_loaded";
                            hasCD = true;
                        }, 200);
                    }
                }
            }
        }

        cd.addEventListener("click", toggleHold);
        cd.addEventListener("touchstart", (e) => {
            e.preventDefault();
            toggleHold();
        });

        document.addEventListener("mousemove", (e) => {
            if (!holding) return;
            cd.style.left = (e.clientX - cd.offsetWidth / 2) + "px";
            cd.style.top = (e.clientY - cd.offsetHeight / 2) + "px";
        });

        document.addEventListener("touchmove", (e) => {
            if (!holding) return;
            const t = e.touches[0];
            cd.style.left = (t.clientX - cd.offsetWidth / 2) + "px";
            cd.style.top = (t.clientY - cd.offsetHeight / 2) + "px";
        });

        player.addEventListener("click", () => {
            switchSound.currentTime = 0;
            switchSound.volume = 0.6;
            switchSound.play().catch(() => { });

            if (playerState === "closed") {
                if (hasCD) {
                    player.src = "../images/loaded.png";
                    playerState = "open_loaded";
                } else {
                    player.src = "../images/open.png";
                    playerState = "open";
                }
                if (!audio.paused) audio.pause();
            } else if (playerState === "open") {
                player.src = "../images/closed.png";
                playerState = "closed";
            } else if (playerState === "open_loaded") {
                player.src = "../images/closedwithdisc.png";
                playerState = "closed";
                setTimeout(() => {
                    audio.play().catch(() => { });
                }, 150);
            }
        });

        window.addEventListener("load", () => {
            setTimeout(() => {
                intro.style.opacity = "0";
                setTimeout(() => {
                    intro.style.display = "none";
                }, 1500);
            }, 500);
        });

    </script>
</body>

</html>
